<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jugar en vivo · Calificador IA</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="juegos.css">
<style>
  :root { --fondo: #0b1030; --caja: #151b4d; --borde: #1f2a6b; --texto: #ffffff; --suave: #c7d2fe; --verde: #22c55e; --rojo: #ef4444; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--fondo); color: var(--texto); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  .portada { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .caja { background: var(--caja); border-radius: 18px; padding: 22px 20px; width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .marca { color: #fde047; font-weight: 800; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  h1 { margin: 6px 0 12px; font-size: 24px; line-height: 1.2; }
  p { color: var(--suave); line-height: 1.45; }
  label { display: block; font-weight: 700; margin: 12px 0 6px; }
  input { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--borde); background: #0f1440; color: #fff; }
  input:focus { outline: none; border-color: #6366f1; }
  #codigo { font-size: 30px; letter-spacing: .25em; text-align: center; font-weight: 800; }
  button.grande { width: 100%; margin-top: 14px; background: var(--verde); color: #fff; border: 0; border-radius: 12px; padding: 14px; font-size: 19px; font-weight: 800; cursor: pointer; }
  button.grande:disabled { opacity: .5; cursor: default; }
  .lista { max-height: 46vh; overflow: auto; margin-top: 8px; border-radius: 12px; border: 2px solid var(--borde); }
  .lista button { display: block; width: 100%; text-align: left; background: transparent; color: #fff; border: 0; border-bottom: 1px solid var(--borde); padding: 12px 14px; font-size: 16px; cursor: pointer; }
  .lista button:hover, .lista button.sel { background: #2f3fa0; }
  .lista button:disabled { color: #6b7280; cursor: default; background: transparent; }
  .lista small { color: #9ca3af; }
  .error { background: #4a1622; border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .nota { font-size: 12px; color: #818cf8; margin-top: 14px; text-align: center; }
  /* Torre por equipos (celular) */
  .t-equipo { margin: -22px -20px 14px; padding: 12px 18px; border-radius: 18px 18px 0 0; font-weight: 900; font-size: 17px; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .t-num { color: var(--suave); font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .t-pregunta { font-size: 20px; font-weight: 800; line-height: 1.3; margin-bottom: 14px; }
  .t-opciones { display: grid; gap: 10px; }
  .t-opciones button { display: flex; align-items: center; gap: 12px; text-align: left; border: 0; border-radius: 14px; padding: 16px 14px; color: #fff; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; min-height: 60px; }
  .t-opciones button b { flex: none; width: 34px; height: 34px; border-radius: 9px; background: rgba(0,0,0,.22); display: grid; place-items: center; font-size: 19px; }
  .t-opciones button:disabled { opacity: .45; }
  .t-opciones button.sel { opacity: 1; outline: 4px solid #fff; }
  .t-elegida { border-radius: 14px; padding: 14px; font-weight: 800; font-size: 18px; margin: 10px 0; }
  .t-veredicto { font-size: 30px; font-weight: 900; margin: 6px 0 4px; }
  .t-veredicto.bien { color: #4ade80; } .t-veredicto.mal { color: #f87171; }
  .t-expl { font-size: 14px; }
  .t-bloques { background: #0f1440; border-radius: 12px; padding: 12px; margin-top: 10px; font-size: 17px; }
  .t-pos { background: #0f1440; border-radius: 12px; padding: 12px; margin-top: 10px; font-size: 16px; }
  .t-mono { background: #4a2a0a; border-radius: 12px; padding: 12px; margin-top: 10px; font-weight: 800; }
  .t-espera { font-size: 46px; text-align: center; margin: 10px 0; animation: tLatir 1.2s ease-in-out infinite alternate; }
  .t-ranking div { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 8px; margin: 8px 0; font-weight: 700; }
  .t-ranking i { display: block; height: 18px; border-radius: 6px; min-width: 4px; }
  .t-ranking b { text-align: right; }
  @keyframes tLatir { from { transform: scale(.92); } to { transform: scale(1.06); } }
</style>
</head>
<body>
<div class="portada"><div class="caja" id="caja">
  <div class="marca">Calificador IA · Juego en vivo</div>
  <h1>Entra al juego de tu clase</h1>
  <label for="codigo">Código del juego</label>
  <input id="codigo" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000">
  <button class="grande" id="buscar">Entrar</button>
  <div id="msg"></div>
  <div class="nota">No necesitas cuenta. Tu docente ve tu puntaje en la tabla de posiciones.</div>
</div></div>

<script src="comun.js"></script>
<script src="laberinto.js"></script>
<script src="plataformas.js"></script>
<script>
"use strict";
const PARAM = new URLSearchParams(location.search);
// La dirección del servidor solo se cambia en pruebas locales (?nube=http://127.0.0.1:…).
const NUBE = (/^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(PARAM.get("nube") || "") ? PARAM.get("nube")
  : "https://waznmuxboomdezeqvkil.supabase.co/functions/v1/calificador");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const guardar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const leer = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };

async function nube(ruta, datos) {
  const r = await fetch(NUBE + ruta, datos ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) } : {});
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.mensaje || "No hay conexión con el servidor. Revisa tu internet.");
  return j;
}
const aviso = (t) => { const m = $("#msg"); if (m) m.innerHTML = t ? `<div class="error">${esc(t)}</div>` : ""; };

let codigo = "", sala = null;

async function buscar() {
  codigo = $("#codigo").value.replace(/\D/g, "");
  if (codigo.length !== 6) return aviso("El código tiene 6 números.");
  $("#buscar").disabled = true; aviso("");
  try { sala = await nube(`/vivo/sala?codigo=${codigo}`); elegir(); }
  catch (e) { aviso(e.message); }
  $("#buscar") && ($("#buscar").disabled = false);
}

function elegir() {
  const previo = leer(`vivo.${codigo}`);
  const caja = $("#caja");
  const conLista = sala.alumnos.length > 0;
  const equipos = sala.modo === "equipos", clasico = sala.modo === "clasico";
  caja.innerHTML = `<div class="marca">${equipos ? "🏗️ Torre por equipos" : clasico ? "⚡ Quiz en vivo" : sala.juego === "laberinto" ? "🧭 Laberinto del saber" : "🍄 Aventura pixel"}</div>
    <h1>${esc(sala.titulo)}</h1>
    <p>${clasico ? `${sala.n_preguntas} preguntas. Mira cada pregunta en la pantalla del aula y responde en tu celular: más puntos si respondes rápido, y más aún si encadenas aciertos.`
      : equipos ? `${sala.n_preguntas} preguntas. Te toca un equipo: cada respuesta correcta suma bloques a la torre de tu equipo. ¡Cuidado con el mono!`
      : `${sala.paquete.preguntas.length} preguntas · ${sala.vidas} vidas. Cada error, cada pregunta sin responder a tiempo y cada enemigo te quita una vida.`}</p>
    ${previo ? `<p>Ya entraste como <b>${esc(previo.nombre)}</b>.</p><button class="grande" id="seguir">▶ Jugar como ${esc(previo.nombre)}</button>
      <p class="nota">¿No eres tú? <a href="#" id="otro" style="color:#a5b4fc">Elegir otro nombre</a></p>` : conLista ? `
      <label for="filtro">Busca tu nombre</label><input id="filtro" placeholder="Escribe tu apellido o nombre" autocomplete="off">
      <div class="lista" id="lista"></div>
      <button class="grande" id="unirme" disabled>Soy yo, ¡a jugar!</button>` : `
      <label for="apodo">Tu nombre</label><input id="apodo" maxlength="30" placeholder="Nombre y apellido">
      <button class="grande" id="unirme">¡A jugar!</button>`}
    <div id="msg"></div>`;
  if (previo) {
    $("#seguir").onclick = () => (sala.modo === "equipos" || sala.modo === "clasico" ? empezarEquipos : empezar)(previo);
    $("#otro").onclick = (e) => { e.preventDefault(); guardar(`vivo.${codigo}`, null); elegir(); };
    return;
  }
  let elegido = "";
  const pintar = () => {
    const f = ($("#filtro").value || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    $("#lista").innerHTML = sala.alumnos.filter((a) => a.nombre.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").includes(f))
      .map((a) => `<button data-id="${esc(a.id)}" class="${a.id === elegido ? "sel" : ""}" ${a.ocupado ? "disabled" : ""}>${esc(a.nombre)}${a.ocupado ? " <small>(ya entró)</small>" : ""}</button>`).join("")
      || `<p style="padding:10px 14px;margin:0">No encuentro ese nombre. Pregunta a tu docente.</p>`;
  };
  if (conLista) {
    pintar();
    $("#filtro").oninput = pintar;
    $("#lista").onclick = (e) => { const b = e.target.closest("button[data-id]"); if (!b) return; elegido = b.dataset.id; pintar(); $("#unirme").disabled = false; };
  }
  $("#unirme").onclick = async () => {
    $("#unirme").disabled = true; aviso("");
    try {
      const r = await nube("/vivo/unirse", conLista ? { codigo, alumno: elegido } : { codigo, apodo: $("#apodo").value });
      const yo = { token: r.token, nombre: r.nombre };
      guardar(`vivo.${codigo}`, yo); (sala.modo === "equipos" || sala.modo === "clasico" ? empezarEquipos : empezar)(yo);
    } catch (e) { aviso(e.message); $("#unirme").disabled = false; if (conLista) { try { sala = await nube(`/vivo/sala?codigo=${codigo}`); pintar(); } catch (x) {} } }
  };
}

function empezar(yo) {
  let cerrada = false, ultimo = null;
  const enviar = async (r, terminado) => {
    ultimo = { token: yo.token, puntos: r.puntos, aciertos: r.aciertos, respondidas: r.respondidas, terminado };
    for (let i = 0; i < 3 && !cerrada; i++) {
      try { await nube("/vivo/progreso", ultimo); return; }
      catch (e) { if (/cerr/i.test(e.message)) { cerrada = true; return; } await new Promise((ok) => setTimeout(ok, 1500 * (i + 1))); }
    }
  };
  document.querySelector(".portada").style.display = "none";
  jugar(sala.paquete, sala.juego, {
    vidas: sala.vidas, repetir: false, sinSalir: true,
    mensajeFinal: `¡Bien, ${esc((yo.nombre.includes(",") ? yo.nombre.split(",")[1] : yo.nombre).trim().split(" ")[0])}! Tu resultado ya está en la tabla de posiciones de tu docente.`,
    alProgreso: (r) => enviar(r, false),
    alTerminar: (r) => enviar(r, true),
  });
}

/* ------------------------------------------------------------ Torre por equipos (el docente lleva el ritmo) */
const COLORES = ["#e5484d", "#3b82f6", "#f5b400", "#22a55b"], LETRAS = ["A", "B", "C", "D"];
function empezarEquipos(yo) {
  const caja = $("#caja");
  document.body.classList.add("modo-torre");
  let estado = null, temporizador = null, cuenta = null, enviando = false, ultimaClave = "";
  const pinta = (html) => { caja.innerHTML = html; };
  const pila = esc(yo.nombre.includes(",") ? yo.nombre.split(",")[1].trim().split(" ")[0] : yo.nombre.split(" ")[0]);
  const cabecera = (e) => {
    if (e.modo === "clasico") return `<div class="t-equipo" style="background:#3b2a9e"><span>${pila}</span><span style="float:right">${e.yo.puntos} pts</span></div>`;
    const eq = e.equipos[e.equipo] || { nombre: "", color: "#6366f1" };
    return `<div class="t-equipo" style="background:${eq.color}">Equipo ${esc(eq.nombre)} · ${pila}</div>`;
  };
  const programar = (ms) => { clearTimeout(temporizador); temporizador = setTimeout(consultar, ms); };
  async function consultar() {
    try {
      const e = await nube(`/vivo/estado?token=${encodeURIComponent(yo.token)}`);
      estado = e; mostrar(e);
    } catch (err) {
      if (/cerr/i.test(err.message)) return pinta(`<div class="marca">Torre por equipos</div><h1>El juego terminó</h1><p>${esc(err.message)}</p>`);
      if (/vuelve a entrar/i.test(err.message)) { guardar(`vivo.${codigo}`, null); return pinta(`<h1>Tu sesión se cerró</h1><p>${esc(err.message)}</p><button class="grande" onclick="location.reload()">Volver a entrar</button>`); }
      aviso(err.message); programar(3000);
    }
  }
  function mostrar(e) {
    const clave = `${e.fase}:${e.indice}:${e.pregunta && e.pregunta.mi_opcion}`;
    if (clave === ultimaClave && e.fase !== "pregunta") return programar(2000);
    ultimaClave = clave; clearInterval(cuenta);
    if (e.fase === "lobby") {
      pinta(`${cabecera(e)}<h1>¡Estás dentro!</h1><p>${e.modo === "clasico" ? "Busca tu nombre en la pantalla del aula." : `Estás en el equipo <b>${esc(e.equipos[e.equipo].nombre)}</b>. Mira la pantalla del aula.`} El juego empieza cuando tu docente lo indique.</p><div class="t-espera">⏳</div>`);
      return programar(2000);
    }
    if (e.fase === "pregunta") {
      const q = e.pregunta;
      if (q.espera_ms > 0 && q.mi_opcion == null) {          // la pregunta se lee primero en la pantalla del aula
        pinta(`${cabecera(e)}<div class="t-num">Pregunta ${e.indice + 1} de ${e.total}</div><h1>¡Prepárate!</h1><p>Lee la pregunta en la pantalla del aula.</p><div class="t-espera">👀</div>`);
        ultimaClave = ""; return programar(q.espera_ms + 150);
      }
      if (q.mi_opcion != null || q.restante_ms <= 0) {
        pinta(`${cabecera(e)}<div class="t-num">Pregunta ${e.indice + 1} de ${e.total}</div>
          ${q.mi_opcion != null ? `<h1>¡Respuesta enviada!</h1><div class="t-elegida" style="background:${COLORES[q.mi_opcion]}">${LETRAS[q.mi_opcion]}) ${esc(q.opciones[q.mi_opcion])}</div><p>Mira la pantalla: en un momento se revela la respuesta.</p>`
            : `<h1>⏰ Se acabó el tiempo</h1><p>Espera la siguiente pregunta.</p>`}`);
        return programar(2000);
      }
      const fin = Date.now() + q.restante_ms;
      pinta(`${cabecera(e)}<div class="t-num">Pregunta ${e.indice + 1} de ${e.total} · <span id="tRest"></span></div>
        <div class="t-pregunta">${esc(q.texto)}</div>
        <div class="t-opciones">${q.opciones.map((o, k) => `<button data-k="${k}" style="background:${COLORES[k]}"><b>${LETRAS[k]}</b><span>${esc(o)}</span></button>`).join("")}</div>
        <div id="msg"></div>`);
      const pintarRestante = () => { const r = Math.max(0, Math.ceil((fin - Date.now()) / 1000)); const el = $("#tRest"); if (el) el.textContent = `${r} s`;
        if (r <= 0) { clearInterval(cuenta); consultar(); } };
      pintarRestante(); cuenta = setInterval(pintarRestante, 250);
      caja.querySelector(".t-opciones").onclick = async (ev) => {
        const b = ev.target.closest("button[data-k]"); if (!b || enviando) return;
        enviando = true; caja.querySelectorAll(".t-opciones button").forEach((x) => (x.disabled = true)); b.classList.add("sel");
        try { await nube("/vivo/responder", { token: yo.token, opcion: +b.dataset.k }); }
        catch (err) { aviso(err.message); }
        enviando = false; clearInterval(cuenta); consultar();
      };
      return;   // mientras responde no se consulta al servidor
    }
    if (e.fase === "resultado") {
      const r = e.resultado, mio = r.por_equipo[e.equipo] || { ganados: 0 }, mono = r.mono;
      const monoTxt = mono && mono.equipo === e.equipo ? (mono.espantado ? "🐒 ¡El mono vino por tu torre y lo espantaron!" : `🐒 ¡El mono tumbó ${mono.quitados} bloques de tu torre!`) : "";
      pinta(`${cabecera(e)}<div class="t-num">Pregunta ${e.indice + 1} de ${e.total}</div>
        <div class="t-veredicto ${r.acerte ? "bien" : "mal"}">${r.acerte ? "¡Correcto! 🎉" : r.mi_opcion == null ? "No respondiste" : "Incorrecto"}</div>
        <p>Respuesta correcta: <b>${LETRAS[r.correcta]}) ${esc(r.opciones[r.correcta])}</b></p>
        ${r.explicacion ? `<p class="t-expl">${esc(r.explicacion)}</p>` : ""}
        ${e.modo === "clasico" ? `<div class="t-bloques">${r.acerte ? `<b>+${r.puntos_ganados}</b> puntos${e.yo.racha >= 2 ? ` · 🔥 racha de ${e.yo.racha}` : ""}` : "Esta vez sin puntos"}</div>
          <div class="t-pos">Vas <b>${e.yo.posicion}.º</b> de ${e.jugadores}${e.yo.posicion > 1 ? ` · a ${e.yo.distancia} pts de ${esc(e.yo.detras_de.includes(",") ? e.yo.detras_de.split(",")[1].trim().split(" ")[0] : e.yo.detras_de.split(" ")[0])}` : " · ¡vas primero!"}</div>`
        : `<div class="t-bloques">Tu equipo ganó <b>+${mio.ganados}</b> bloques${mio.bonus ? " (¡el más rápido!)" : ""}</div>`}
        ${monoTxt ? `<div class="t-mono">${monoTxt}</div>` : ""}`);
      return programar(2000);
    }
    if (e.fase === "final" && e.modo === "clasico") {
      const p = e.yo.posicion;
      pinta(`${cabecera(e)}<h1>${p === 1 ? "🏆 ¡Ganaste!" : p <= 3 ? `🥇🥈🥉 ¡Podio! Puesto ${p}` : `Quedaste en el puesto ${p}`}</h1>
        <p>de ${e.jugadores} jugadores · <b>${e.yo.puntos}</b> puntos</p><p>Respuestas correctas: <b>${e.yo.aciertos} de ${e.total}</b>.</p>
        <p class="nota">¡Gracias por jugar! Ya puedes cerrar esta página.</p>`);
      return;
    }
    if (e.fase === "final") {
      const orden = e.equipos.map((x, i) => ({ ...x, i })).sort((a, b) => b.bloques - a.bloques);
      const max = Math.max(1, ...orden.map((x) => x.bloques));
      const pos = orden.findIndex((x) => x.i === e.equipo) + 1;
      pinta(`${cabecera(e)}<h1>${pos === 1 ? "🏆 ¡Tu equipo ganó!" : `Tu equipo quedó en el puesto ${pos}`}</h1>
        <div class="t-ranking">${orden.map((x, n) => `<div><span>${n + 1}. ${esc(x.nombre)}</span><i style="width:${Math.round(100 * x.bloques / max)}%;background:${x.color}"></i><b>${x.bloques}</b></div>`).join("")}</div>
        <p>Tus respuestas correctas: <b>${e.yo.aciertos} de ${e.total}</b>.</p><p class="nota">¡Gracias por jugar! Ya puedes cerrar esta página.</p>`);
      return;
    }
  }
  consultar();
}

$("#codigo").value = (PARAM.get("c") || "").replace(/\D/g, "").slice(0, 6);
$("#buscar").onclick = buscar;
$("#codigo").onkeydown = (e) => e.key === "Enter" && buscar();
if ($("#codigo").value.length === 6) buscar();
</script>
</body>
</html>
